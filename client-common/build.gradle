// study/calendar/content-service에 복붙되어 있던 서비스 간 동기 HTTP 클라이언트

plugins {
	id 'java-library'
	id 'io.spring.dependency-management'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
	}
}

dependencies {
	compileOnly 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
	// UserServiceClient의 이름 캐시(cache-aside)가 쓰는 StringRedisTemplate 타입
	compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation project(':web-common')

	api 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
	api 'io.github.resilience4j:resilience4j-retry:2.4.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core'
	testImplementation 'com.fasterxml.jackson.core:jackson-databind'
	testImplementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
