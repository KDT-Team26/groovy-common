// 6개 서비스 전부가 쓰는 관측성 모듈: 로그 포맷(logback-json.xml + TraceIdTurboFilter +
// LogFields), HTTP 상태코드 observation 태그(HttpStatusObservationFilter), 분산 트레이싱
// 조립(TracingConfig — 6개 서비스 config/TracingConfig.java 를 여기로 합침).
// Business Service/Entity 는 절대 넣지 않는다.
plugins {
	id 'java-library'
	id 'io.spring.dependency-management'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
	}
}

dependencies {
	// 이 모듈이 제공하는 observability/logback-json.xml 이 참조하는 인코더.
	// api 로 노출해 이 모듈에 의존하는 서비스가 별도로 다시 선언하지 않아도 되게 한다.
	api 'net.logstash.logback:logstash-logback-encoder:8.0'

	// 아래는 전부 컴파일에만 필요 — 실제 버전은 이 모듈을 쓰는 서비스가
	// spring-boot-opentelemetry / spring-boot-micrometer-tracing / starter-logging 등으로
	// 이미 갖고 있는 걸 그대로 쓴다 (compileOnly 라 이 모듈이 버전을 강제하지 않는다).

	// LogFields / TraceIdTurboFilter / HttpStatusObservationFilter
	compileOnly 'io.opentelemetry:opentelemetry-api'
	compileOnly 'ch.qos.logback:logback-classic'
	compileOnly 'io.micrometer:micrometer-observation'
	compileOnly 'org.springframework:spring-web'
	compileOnly 'jakarta.servlet:jakarta.servlet-api'

	// TracingConfig
	compileOnly 'org.springframework:spring-context'
	compileOnly 'io.micrometer:micrometer-tracing'
	compileOnly 'io.micrometer:micrometer-tracing-bridge-otel'
	compileOnly 'io.opentelemetry:opentelemetry-sdk'
	compileOnly 'io.opentelemetry:opentelemetry-sdk-trace'
	compileOnly 'io.opentelemetry:opentelemetry-sdk-common'
	compileOnly 'io.opentelemetry:opentelemetry-context'
	compileOnly 'io.opentelemetry:opentelemetry-exporter-otlp'
}
