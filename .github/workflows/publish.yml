# 수동 게시 (break-glass). 정규 릴리스는 release-please.yml 이 담당한다 —
# 이 워크플로는 특정 버전을 다시 게시하거나, Release PR 절차 없이 급히 내보내야 할 때만 쓴다.
name: Publish (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "게시할 버전 (예 0.1.0). 비우면 0.1.0-SNAPSHOT"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve version
        id: ver
        run: echo "value=${{ inputs.version || '0.1.0-SNAPSHOT' }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: ./gradlew publish -PreleaseVersion=${{ steps.ver.outputs.value }} --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### 수동 게시 완료: \`${{ steps.ver.outputs.value }}\`"
            echo ""
            echo "com.groovy.backend:{event-contract, observability, web-common, security-common, client-common, outbox}:${{ steps.ver.outputs.value }}"
          } >> "$GITHUB_STEP_SUMMARY"
