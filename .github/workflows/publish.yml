# 태그(v*) push 시 6개 모듈을 GitHub Packages (Maven) 에 게시한다.
# 소비 측(서비스 레포)은 read:packages PAT(조직 시크릿 GPR_TOKEN / 로컬 gpr.key)로 내려받는다.
name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 게시할 버전 (예: 0.1.0). 비우면 0.1.0-SNAPSHOT
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: ./gradlew publish -PreleaseVersion=${{ steps.ver.outputs.value }} --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### 게시 완료: \`${{ steps.ver.outputs.value }}\`"
            echo ""
            echo "- com.groovy.backend:event-contract"
            echo "- com.groovy.backend:observability"
            echo "- com.groovy.backend:web-common"
            echo "- com.groovy.backend:security-common"
            echo "- com.groovy.backend:client-common"
            echo "- com.groovy.backend:outbox"
          } >> "$GITHUB_STEP_SUMMARY"
