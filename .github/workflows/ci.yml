# main 으로 가는 PR / main push 에서 6개 모듈 컴파일 + 계약 테스트.
# release-please 의 Release PR 머지 전에 사람이 green 을 확인하는 게이트 역할.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build (6개 모듈 + 계약 테스트)
        run: ./gradlew build --no-daemon --console=plain
